<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1760" viewBox="0 0 1400 1760">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px Arial, sans-serif; fill: #1e293b; }
      .boxTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 18px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="1760" fill="#f8fafc"/>
  <text x="700" y="70" text-anchor="middle" class="title">RAG V4 — MBA PDF + Ollama</text>
  <text x="700" y="108" text-anchor="middle" class="subtitle">Working local RAG with metadata, reranking, Ollama generation, and source citations</text>

  <text x="700" y="160" text-anchor="middle" class="section">Indexing Pipeline</text>

  <rect x="360" y="195" width="680" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="232" text-anchor="middle" class="boxTitle">Private Local MBA PDF</text>
  <text x="700" y="261" text-anchor="middle" class="boxText">Source file stays local and is ignored by Git</text>

  <line x1="700" y1="285" x2="700" y2="320" class="arrow"/>

  <rect x="360" y="320" width="680" height="105" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="360" text-anchor="middle" class="boxTitle">PyMuPDFLoader → Cleaning → Metadata</text>
  <text x="700" y="390" text-anchor="middle" class="boxText">PDF page • course • chapter • source</text>

  <line x1="700" y1="425" x2="700" y2="460" class="arrow"/>

  <rect x="360" y="460" width="680" height="115" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="500" text-anchor="middle" class="boxTitle">RecursiveCharacterTextSplitter</text>
  <text x="700" y="531" text-anchor="middle" class="boxText">800 characters • 120 overlap</text>
  <text x="700" y="557" text-anchor="middle" class="small">Preserves LangChain Document metadata</text>

  <line x1="700" y1="575" x2="700" y2="610" class="arrow"/>

  <rect x="360" y="610" width="680" height="100" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="700" y="649" text-anchor="middle" class="boxTitle">Noise Filtering</text>
  <text x="700" y="680" text-anchor="middle" class="boxText">Remove front matter and low-value boilerplate</text>

  <line x1="700" y1="710" x2="700" y2="745" class="arrow"/>

  <rect x="360" y="745" width="680" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="786" text-anchor="middle" class="boxTitle">Hugging Face Embeddings</text>
  <text x="700" y="817" text-anchor="middle" class="boxText">all-MiniLM-L6-v2 • 384 dimensions</text>

  <line x1="700" y1="855" x2="700" y2="890" class="arrow"/>

  <rect x="360" y="890" width="680" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="929" text-anchor="middle" class="boxTitle">ChromaDB</text>
  <text x="700" y="960" text-anchor="middle" class="boxText">351 indexed course chunks</text>

  <text x="700" y="1050" text-anchor="middle" class="section">Question Answering Pipeline</text>

  <rect x="250" y="1080" width="900" height="95" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="700" y="1118" text-anchor="middle" class="boxTitle">User Question → MiniLM Question Embedding</text>
  <text x="700" y="1147" text-anchor="middle" class="boxText">Convert the question to the same vector space</text>

  <line x1="700" y1="1175" x2="700" y2="1210" class="arrow"/>

  <rect x="250" y="1210" width="900" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="1248" text-anchor="middle" class="boxTitle">ChromaDB Semantic Search — Top 8</text>
  <text x="700" y="1277" text-anchor="middle" class="boxText">Find the most semantically similar chunks</text>

  <line x1="700" y1="1305" x2="700" y2="1340" class="arrow"/>

  <rect x="250" y="1340" width="900" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="1379" text-anchor="middle" class="boxTitle">CrossEncoder Reranking</text>
  <text x="700" y="1410" text-anchor="middle" class="boxText">ms-marco-MiniLM-L6-v2 → Best 3 chunks</text>

  <line x1="700" y1="1445" x2="700" y2="1480" class="arrow"/>

  <rect x="250" y="1480" width="900" height="105" rx="18" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="700" y="1519" text-anchor="middle" class="boxTitle">Context + Ollama</text>
  <text x="700" y="1550" text-anchor="middle" class="boxText">qwen3:4b-instruct • temperature 0</text>

  <line x1="700" y1="1585" x2="700" y2="1620" class="arrow"/>

  <rect x="250" y="1620" width="900" height="95" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="700" y="1658" text-anchor="middle" class="boxTitle">Grounded Answer + Citation</text>
  <text x="700" y="1687" text-anchor="middle" class="boxText">Example: [C200, PDF page 10]</text>
</svg>