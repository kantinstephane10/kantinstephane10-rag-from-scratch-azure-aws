<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .h{font-size:34px;font-weight:700}
    .s{font-size:20px;font-weight:600}
    .b{font-size:17px}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}
    .accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:16}
    .green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}
    .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="70" y="70" class="t h">RAG V8 — Query-Aware Retrieval + Deterministic Citations</text>

  <rect x="600" y="105" width="400" height="80" class="accent"/>
  <text x="800" y="140" text-anchor="middle" class="t s">User Question</text>
  <text x="800" y="165" text-anchor="middle" class="t b">Detect focused vs. broad query</text>

  <path d="M800 185 L800 235" class="arrow"/>
  <rect x="600" y="235" width="400" height="80" class="accent"/>
  <text x="800" y="270" text-anchor="middle" class="t s">Query Router</text>
  <text x="800" y="295" text-anchor="middle" class="t b">Focused or Broad</text>

  <path d="M690 315 L430 385" class="arrow"/>
  <path d="M910 315 L1170 385" class="arrow"/>

  <rect x="130" y="385" width="600" height="310" class="box"/>
  <text x="430" y="425" text-anchor="middle" class="t s">Focused Retrieval</text>
  <text x="180" y="470" class="t b">1. MiniLM embeds the question</text>
  <text x="180" y="510" class="t b">2. ChromaDB returns Top 8 semantic matches</text>
  <text x="180" y="550" class="t b">3. Expand previous/current/next chunk (same course)</text>
  <text x="180" y="590" class="t b">4. CrossEncoder reranks candidates</text>
  <text x="180" y="630" class="t b">5. Best 3 chunks become answer context</text>

  <rect x="870" y="385" width="600" height="310" class="box"/>
  <text x="1170" y="425" text-anchor="middle" class="t s">Broad / Portfolio Retrieval</text>
  <text x="920" y="470" class="t b">1. Search every MBA course independently</text>
  <text x="920" y="510" class="t b">2. Retrieve 4 semantic candidates per course</text>
  <text x="920" y="550" class="t b">3. Add same-course neighbors</text>
  <text x="920" y="590" class="t b">4. CrossEncoder reranks within each course</text>
  <text x="920" y="630" class="t b">5. Keep best evidence per course</text>

  <path d="M430 695 L680 755" class="arrow"/>
  <path d="M1170 695 L920 755" class="arrow"/>

  <rect x="540" y="755" width="520" height="100" class="green"/>
  <text x="800" y="790" text-anchor="middle" class="t s">Ollama + Deterministic Citation Layer</text>
  <text x="800" y="820" text-anchor="middle" class="t b">LLM emits [SOURCE N] → Python maps trusted course/page metadata</text>
</svg>