<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160">
<defs>
  <linearGradient id="bgBlue" x1="0" x2="1">
    <stop offset="0" stop-color="#eef6ff"/>
    <stop offset="1" stop-color="#fbfdff"/>
  </linearGradient>
  <linearGradient id="bgPurple" x1="0" x2="1">
    <stop offset="0" stop-color="#f5efff"/>
    <stop offset="1" stop-color="#fcfaff"/>
  </linearGradient>
  <linearGradient id="bgGreen" x1="0" x2="1">
    <stop offset="0" stop-color="#edf9f2"/>
    <stop offset="1" stop-color="#fbfffd"/>
  </linearGradient>
  <linearGradient id="bgOrange" x1="0" x2="1">
    <stop offset="0" stop-color="#fff4e8"/>
    <stop offset="1" stop-color="#fffaf5"/>
  </linearGradient>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16324f" flood-opacity=".12"/>
  </filter>

  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
  </marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
  </marker>
  <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
  </marker>

  <style>
    .title{font:700 38px Arial,Helvetica,sans-serif;fill:#102a56}
    .subtitle{font:400 16px Arial,Helvetica,sans-serif;fill:#475569}
    .lane{font:700 17px Arial,Helvetica,sans-serif;fill:#fff}
    .section{font:700 19px Arial,Helvetica,sans-serif;fill:#14396e}
    .bt{font:700 14px Arial,Helvetica,sans-serif;fill:#111827}
    .bs{font:400 11px Arial,Helvetica,sans-serif;fill:#475569}
    .small{font:600 11px Arial,Helvetica,sans-serif;fill:#334155}
    .box{fill:#fff;stroke:#82aeda;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .boxP{fill:#fff;stroke:#a78bfa;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .boxG{fill:#fff;stroke:#6cc49b;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .boxO{fill:#fff;stroke:#f2a95c;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .flowB{stroke:#2563eb;stroke-width:2.6;fill:none;marker-end:url(#arrowBlue)}
    .flowP{stroke:#7c3aed;stroke-width:2.6;fill:none;marker-end:url(#arrowPurple)}
    .flowG{stroke:#059669;stroke-width:2.6;fill:none;marker-end:url(#arrowGreen)}
    .flowO{stroke:#ea580c;stroke-width:2.6;fill:none;marker-end:url(#arrowOrange)}
    .loop{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#arrowPurple);stroke-dasharray:8 7}
    .dash{stroke-dasharray:8 8;animation:dash 2.5s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
  </style>

  <path id="buildPath" d="M360 205 H510 H660 H825 H1000 H1190 H1400" fill="none"/>
  <path id="runtimePath" d="M360 430 H565 H785 H1000 H1210" fill="none"/>
  <path id="focusedPath" d="M1210 430 V570 H425 H595 H760 H915 V835 H375 H570 H780 H995 H1210 H1435 H1610" fill="none"/>
  <path id="broadPath" d="M1210 430 V570 H1280 H1110 H1280 H1445 H1610 V835 H375 H570 H780 H995 H1210 H1435 H1610" fill="none"/>
