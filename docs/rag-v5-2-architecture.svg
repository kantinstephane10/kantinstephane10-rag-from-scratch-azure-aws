<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1940" viewBox="0 0 1400 1940">
  <defs>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 21px Arial, sans-serif; fill: #475569; }
      .section { font: 700 24px Arial, sans-serif; fill: #1e293b; }
      .boxTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 18px Arial, sans-serif; fill: #334155; }
      .small { font: 400 16px Arial, sans-serif; fill: #475569; }
      .metric { font: 700 20px Arial, sans-serif; fill: #065f46; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="1940" fill="#f8fafc"/>
  <text x="700" y="70" text-anchor="middle" class="title">RAG V5.2 — Neighbor Expansion</text>
  <text x="700" y="108" text-anchor="middle" class="subtitle">Validated retrieval architecture: semantic search + adjacent context + reranking + Ollama</text>

  <text x="700" y="160" text-anchor="middle" class="section">Indexing Pipeline</text>

  <rect x="360" y="195" width="680" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="232" text-anchor="middle" class="boxTitle">Private Local MBA PDF</text>
  <text x="700" y="261" text-anchor="middle" class="boxText">PDF remains local and excluded from Git</text>

  <line x1="700" y1="285" x2="700" y2="320" class="arrow"/>

  <rect x="360" y="320" width="680" height="105" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="360" text-anchor="middle" class="boxTitle">Load → Clean → Add Metadata</text>
  <text x="700" y="390" text-anchor="middle" class="boxText">PyMuPDFLoader • course • chapter • PDF page</text>

  <line x1="700" y1="425" x2="700" y2="460" class="arrow"/>

  <rect x="360" y="460" width="680" height="115" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="700" y="500" text-anchor="middle" class="boxTitle">RecursiveCharacterTextSplitter</text>
  <text x="700" y="531" text-anchor="middle" class="boxText">800 characters • 120 overlap</text>
  <text x="700" y="557" text-anchor="middle" class="small">354 course chunks before noise filtering</text>

  <line x1="700" y1="575" x2="700" y2="610" class="arrow"/>

  <rect x="360" y="610" width="680" height="100" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="700" y="649" text-anchor="middle" class="boxTitle">Noise Filtering</text>
  <text x="700" y="680" text-anchor="middle" class="boxText">351 final indexed chunks</text>

  <line x1="700" y1="710" x2="700" y2="745" class="arrow"/>

  <rect x="360" y="745" width="680" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="786" text-anchor="middle" class="boxTitle">MiniLM Embeddings → ChromaDB</text>
  <text x="700" y="817" text-anchor="middle" class="boxText">all-MiniLM-L6-v2 • 384 dimensions • cosine search</text>

  <text x="700" y="930" text-anchor="middle" class="section">Improved Retrieval Pipeline</text>

  <rect x="240" y="965" width="920" height="95" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="700" y="1003" text-anchor="middle" class="boxTitle">User Question → Question Embedding</text>
  <text x="700" y="1032" text-anchor="middle" class="boxText">Same MiniLM model used for indexed chunks</text>

  <line x1="700" y1="1060" x2="700" y2="1095" class="arrow"/>

  <rect x="240" y="1095" width="920" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="1135" text-anchor="middle" class="boxTitle">ChromaDB Semantic Retrieval — Top 8</text>
  <text x="700" y="1165" text-anchor="middle" class="boxText">Initial high-recall candidate set</text>

  <line x1="700" y1="1195" x2="700" y2="1230" class="arrow"/>

  <rect x="240" y="1230" width="920" height="125" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="700" y="1272" text-anchor="middle" class="boxTitle">Neighbor Expansion — NEW IN V5.2</text>
  <text x="700" y="1304" text-anchor="middle" class="boxText">For each retrieved chunk, add previous + current + next chunk</text>
  <text x="700" y="1332" text-anchor="middle" class="small">Same-course boundary protection • Deduplicate candidates</text>

  <line x1="700" y1="1355" x2="700" y2="1390" class="arrow"/>

  <rect x="240" y="1390" width="920" height="105" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="700" y="1429" text-anchor="middle" class="boxTitle">CrossEncoder Reranking</text>
  <text x="700" y="1460" text-anchor="middle" class="boxText">ms-marco-MiniLM-L6-v2 → Best 3 evidence chunks</text>

  <line x1="700" y1="1495" x2="700" y2="1530" class="arrow"/>

  <rect x="240" y="1530" width="920" height="105" rx="18" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="700" y="1569" text-anchor="middle" class="boxTitle">Context → Ollama qwen3:4b-instruct</text>
  <text x="700" y="1600" text-anchor="middle" class="boxText">Grounded generation with course + PDF-page citations</text>

  <line x1="700" y1="1635" x2="700" y2="1670" class="arrow"/>

  <rect x="240" y="1670" width="920" height="95" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="700" y="1708" text-anchor="middle" class="boxTitle">Grounded Answer</text>
  <text x="700" y="1737" text-anchor="middle" class="boxText">Best 3 chunks are the only document context sent to the LLM</text>

  <rect x="220" y="1810" width="960" height="90" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="1846" text-anchor="middle" class="metric">Validated retrieval: Hit@3 = 100% • Hit@8 = 100% • MRR = 0.875</text>
  <text x="700" y="1877" text-anchor="middle" class="small">12 evaluation questions spanning all six MBA courses</text>
</svg>