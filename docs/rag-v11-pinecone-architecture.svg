    .section{font:700 19px Arial,Helvetica,sans-serif;fill:#14396e}
    .bt{font:700 14px Arial,Helvetica,sans-serif;fill:#111827}
    .bs{font:400 11px Arial,Helvetica,sans-serif;fill:#475569}
    .small{font:600 11px Arial,Helvetica,sans-serif;fill:#334155}
