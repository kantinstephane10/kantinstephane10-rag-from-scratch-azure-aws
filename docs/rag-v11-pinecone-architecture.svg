    .boxP{fill:#fff;stroke:#a78bfa;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .boxG{fill:#fff;stroke:#6cc49b;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .boxO{fill:#fff;stroke:#f2a95c;stroke-width:1.5;rx:14;filter:url(#shadow)}
    .fb{stroke:#2563eb;stroke-width:2.7;fill:none;marker-end:url(#ab)}
    .fp{stroke:#7c3aed;stroke-width:2.7;fill:none;marker-end:url(#ap)}
    .fg{stroke:#059669;stroke-width:2.7;fill:none;marker-end:url(#ag)}
    .fo{stroke:#ea580c;stroke-width:2.7;fill:none;marker-end:url(#ao)}
    .dash{stroke-dasharray:8 7;animation:dash 2.5s linear infinite}
