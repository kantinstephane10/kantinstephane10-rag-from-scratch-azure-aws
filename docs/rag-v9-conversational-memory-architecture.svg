<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040">
  <rect width="1700" height="1040" fill="#ffffff"/>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#111827}
    .h{font-size:34px;font-weight:700}
    .s{font-size:20px;font-weight:700}
    .b{font-size:16px}
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:16}
    .blue{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:16}
    .green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:16}
    .amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:16}
    .arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>

  <text x="70" y="65" class="t h">RAG V9 — Conversational Memory + Course-Aware Grounding</text>

  <rect x="620" y="100" width="460" height="80" class="blue"/>
  <text x="850" y="135" text-anchor="middle" class="t s">Current User Question</text>
  <text x="850" y="160" text-anchor="middle" class="t b">e.g. “Which one was ranked highest?”</text>

  <rect x="90" y="100" width="390" height="80" class="green"/>
  <text x="285" y="135" text-anchor="middle" class="t s">Conversation History</text>
  <text x="285" y="160" text-anchor="middle" class="t b">Recent 12 user/assistant messages</text>

  <path d="M480 140 L620 140" class="arrow"/>
  <path d="M850 180 L850 230" class="arrow"/>

  <rect x="600" y="230" width="500" height="95" class="green"/>
  <text x="850" y="265" text-anchor="middle" class="t s">Follow-Up Question Rewriter</text>
  <text x="850" y="292" text-anchor="middle" class="t b">Turns ambiguous follow-up into standalone retrieval query</text>

  <path d="M850 325 L850 375" class="arrow"/>
  <rect x="630" y="375" width="440" height="80" class="blue"/>
  <text x="850" y="410" text-anchor="middle" class="t s">Query Router</text>
  <text x="850" y="435" text-anchor="middle" class="t b">Focused vs. Broad</text>

  <path d="M740 455 L440 515" class="arrow"/>
  <path d="M960 455 L1260 515" class="arrow"/>

  <rect x="120" y="515" width="640" height="260" class="box"/>
  <text x="440" y="555" text-anchor="middle" class="t s">Focused Retrieval</text>
  <text x="175" y="600" class="t b">MiniLM question embedding</text>
  <text x="175" y="635" class="t b">ChromaDB Top 8 semantic candidates</text>
  <text x="175" y="670" class="t b">Same-course neighbor expansion ±1</text>
  <text x="175" y="705" class="t b">CrossEncoder reranking → best 3</text>

  <rect x="940" y="515" width="640" height="260" class="box"/>
  <text x="1260" y="555" text-anchor="middle" class="t s">Broad Retrieval</text>
  <text x="995" y="600" class="t b">Search each of the six MBA courses independently</text>
  <text x="995" y="635" class="t b">Neighbor expansion + CrossEncoder per course</text>
  <text x="995" y="670" class="t b">Best evidence per course</text>
  <text x="995" y="705" class="t b">Strict course relevance gate removes indirect false positives</text>

  <path d="M440 775 L700 835" class="arrow"/>
  <path d="M1260 775 L1000 835" class="arrow"/>

  <rect x="560" y="835" width="580" height="115" class="amber"/>
  <text x="850" y="875" text-anchor="middle" class="t s">Grounded Generation</text>
  <text x="850" y="905" text-anchor="middle" class="t b">Ollama answers from retrieved evidence using [SOURCE N]</text>
  <text x="850" y="932" text-anchor="middle" class="t b">Python maps trusted metadata, deduplicates citations, preserves valid refusal</text>

  <path d="M850 950 L850 985" class="arrow"/>
  <text x="850" y="1020" text-anchor="middle" class="t s">Save Turn → Memory for Next Question</text>
</svg>