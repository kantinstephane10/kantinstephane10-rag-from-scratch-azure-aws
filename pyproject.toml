[project]
name = "rag-from-scratch-azure-aws"
version = "0.1.0"
description = "End-to-end RAG learning project using Azure/AWS content, Hugging Face embeddings, ChromaDB, and a local Hugging Face LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "langchain-community",
    "langchain-text-splitters",
    "sentence-transformers",
    "transformers",
    "torch",
    "accelerate",
]

[tool.uv]
package = false
