[project]
name = "rag-from-scratch-azure-aws"
version = "0.2.0"
description = "End-to-end local RAG with PDF ingestion, recursive chunking, Hugging Face embeddings, ChromaDB, reranking, and Ollama generation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-ollama",
    "sentence-transformers",
    "pymupdf",
    "torch",
]

[tool.uv]
package = false
