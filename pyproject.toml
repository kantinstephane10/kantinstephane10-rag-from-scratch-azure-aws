[project]
name = "rag-from-scratch-azure-aws"
version = "0.3.0"
description = "Local RAG with PDF ingestion, MiniLM embeddings, ChromaDB, neighbor expansion, reranking, Ollama, evaluation, and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-ollama",
    "sentence-transformers",
    "pymupdf",
    "streamlit",
    "torch",
]

[tool.uv]
package = false
