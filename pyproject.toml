[project]
name = "rag-from-scratch-azure-aws"
version = "0.3.0"
description = "RAG with PDF ingestion, MiniLM embeddings, Pinecone, neighbor expansion, reranking, Ollama, persistent memory, evaluation, and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pinecone>=10.3,<11",
    "certifi>=2026.10.19",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-ollama",
    "sentence-transformers",
    "pymupdf",
    "streamlit",
    "torch",
]

[tool.uv]
package = false
